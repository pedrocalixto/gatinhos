<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Galeria de Gatinhos{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <i class="fas fa-cat"></i> Galeria de Gatinhos
            </div>
            <ul>
                <li>
                    <a href="{{ url_for('home') }}"
                       {% if request.endpoint == 'home' %}class="active"{% endif %}>Início</a>
                </li>
                <li>
                    <a href="{{ url_for('about') }}"
                       {% if request.endpoint == 'about' %}class="active"{% endif %}>Sobre</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; {{ current_year }} Galeria de Gatinhos Fofos | Todas as imagens do Pixabay</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
